<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brooklyn Bowl — выберите город</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#0B0B0C;
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }
  .wordmark{
    font-size:15px;
    font-weight:800;
    letter-spacing:0.12em;
    color:#E42725;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  h1{
    font-size:clamp(26px,4vw,38px);
    font-weight:700;
    margin:0 0 40px;
    text-align:center;
    color:#fff;
  }
  .cities{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    justify-content:center;
    width:100%;
    max-width:640px;
  }
  .city{
    flex:1 1 260px;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:28px 26px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.12);
    background:#141417;
    transition:border-color .2s ease, transform .16s cubic-bezier(.34,1.4,.64,1), background-color .2s ease;
  }
  .city:hover{
    border-color:#E42725;
    background:#17171a;
    transform:translateY(-2px);
  }
  .city-name{
    font-size:22px;
    font-weight:700;
    color:#fff;
  }
  .city-sub{
    font-size:14px;
    color:#9C9A95;
  }
  .city-arrow{
    margin-top:14px;
    font-size:14px;
    font-weight:600;
    color:#E42725;
  }
  footer{
    margin-top:56px;
    font-size:12px;
    color:#6E6C68;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="wordmark">Brooklyn Bowl</div>
  <h1>Выберите город</h1>
  <div class="cities">
    <a class="city" href="tyumen/index.html">
      <span class="city-name">Тюмень</span>
      <span class="city-sub">3 точки</span>
      <span class="city-arrow">Перейти →</span>
    </a>
    <a class="city" href="izhevsk/index.html">
      <span class="city-name">Ижевск</span>
      <span class="city-sub">2 точки</span>
      <span class="city-arrow">Перейти →</span>
    </a>
    <a class="city" href="nv/index.html">
      <span class="city-name">Нижневартовск</span>
      <span class="city-sub">1 точка</span>
      <span class="city-arrow">Перейти →</span>
    </a>
    <a class="city" href="surgut/index.html">
      <span class="city-name">Сургут</span>
      <span class="city-sub">1 точка</span>
      <span class="city-arrow">Перейти →</span>
    </a>
    <a class="city" href="samara/index.html">
      <span class="city-name">Самара</span>
      <span class="city-sub">2 точки</span>
      <span class="city-arrow">Перейти →</span>
    </a>
    <a class="city" href="msk/index.html">
      <span class="city-name">Москва</span>
      <span class="city-sub">2 точки</span>
      <span class="city-arrow">Перейти →</span>
    </a>
    <a class="city" href="spb/index.html">
      <span class="city-name">Санкт-Петербург</span>
      <span class="city-sub">1 точка</span>
      <span class="city-arrow">Перейти →</span>
    </a>
  </div>
  <footer>© Brooklyn Bowl</footer>
</body>
</html>
